name: go

on:
  push:
    branches: [main]
    tags: ['go/v*']
  pull_request:

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: go vet (32-bit)
        run: GOOS=linux GOARCH=386 go vet ./...
      - run: go test -race ./...
      - name: Tag matches Version
        if: startsWith(github.ref, 'refs/tags/go/v')
        run: |
          version="${GITHUB_REF_NAME#go/v}"
          grep -qx "const Version = \"$version\"" relume.go || {
            echo "Tag $GITHUB_REF_NAME doesn't match Version in relume.go"
            exit 1
          }
